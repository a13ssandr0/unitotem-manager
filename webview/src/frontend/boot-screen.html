<!DOCTYPE html>
<html lang="en">

<head>
    <title>UniTotem</title>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <style>
        @font-face {
            font-family: Noto Sans;
            src: url(NotoSans.ttf);
        }

        /* 0deg */
        body {
            font-size: 1.3vw;
            margin: 0;
            position: absolute;
            width: 100vw;
            height: 100vh;
            object-fit: cover;
            visibility: visible;
        }

        /* 90deg */
        body[r="1"] {
            font-size: 1.3vh;
            transform: rotate(90deg);
            transform-origin: bottom left;
            width: 100vh;
            height: 100vw;
            top: -100vw;
        }

        /* 180deg */
        body[r="2"] { transform: rotate(180deg); }

        /* 270deg */
        body[r="3"] {
            font-size: 1.3vh;
            transform: rotate(270deg);
            transform-origin: top left; 
            width: 100vh;
            height: 100vw;
            top: 100vh;
        }
        
        main {
            background: black; 
            height: 100%;
            color: white;
            margin: 0;
            overflow: hidden;
            position: relative;
        }

        main[f="1"]{
            -webkit-transform: scaleX(-1);
            transform: scaleX(-1);
        }

        main[f="2"]{
            -webkit-transform: scaleY(-1);
            transform: scaleY(-1);
        }
        
        .center{
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
        }

        .welcome {
            transform: scale(0.75);
            opacity: 0;
            filter: blur(4px);
            animation: scale 3s forwards cubic-bezier(0.5, 1, 0.89, 1), fade-in 0.8s 0.1s forwards cubic-bezier(0.11, 0, 0.5, 0);
        }
        @keyframes scale {100% {transform: scale(2);}}
        @keyframes fade-in {100% {opacity: 1; filter: blur(0);}}

        .loader {
            display: inline-block;
            font-size: 7.5em;
            font-family: "Noto Sans", sans-serif;
            font-weight: bold;
            color: #FFF;
            position: relative;
        }
        .loader::before {
            content: '';  
            position: absolute;
            left: 2.19em;
            bottom: 0.28em;
            width: 0.600em;
            height: 0.600em;
            border-radius: 50%;
            border: 0.13em solid #FFF;
            border-bottom-color: #FF3D00;
            box-sizing: border-box;
            animation: rotation 3s linear infinite;
        }
        @keyframes rotation {
            0% {transform: rotate(0deg); box-shadow: 0 0 0.313rem #000000;}
            33% {transform: rotate(360deg);}
            50% {box-shadow: 0 0 0.625rem #ffffff;}
            67% {transform: rotate(720deg);}
            100% {transform: rotate(1080deg); box-shadow: 0 0 0.313rem #000000;}
        } 

        .glow {
            -webkit-animation: glow 1.5s linear infinite alternate;
            -moz-animation: glow 1.5s linear infinite alternate;
            animation: glow 1.5s linear infinite alternate;
        }
        @keyframes glow {
            from {text-shadow: 0 0 0.313em #000000;}
            to {text-shadow: 0 0 0.625em #ffffff;}
        }
        

        .media-viewer{
            display: none;
            background-color: black;
            position: absolute;
            height: 100%;
            width: 100%;
            margin: auto;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            object-fit: contain;
            user-select: none;
        }
    </style>
</head>

<body>
    <main>
        <div id="boot_screen" class="center">
            <div class="welcome">
                <div class="glow">
                    <span class="loader">UniT&nbsp;&nbsp;tem</span> <!-- https://github.com/vineethtrv/css-loader -->
                </div>
            </div>
        </div>
        <webview id="webview" class="media-viewer"></webview>
        <img    id="imageview" class="media-viewer">
        <video  id="videoview" class="media-viewer"></video>
    </main>
</body>

<!--suppress FallThroughInSwitchStatementJS -->
<script type="text/javascript" charset="utf-8">
    let lastCont = 'boot';
    document.main     = document.getElementsByTagName('main')[0];
    const boot_screen = document.getElementById('boot_screen');
    const webview     = document.getElementById('webview');
    const imageview   = document.getElementById('imageview');
    const canvas      = document.createElement('canvas');
    const context     = canvas.getContext('2d');
    const videoview   = document.getElementById('videoview');
    const containers  = [boot_screen, webview, imageview, videoview];
    
    canvas.width = 1;
    canvas.height = 1;

    window.onload = async () => {
        document.body.setAttribute('r', await window.electronAPI.getOrientation());
        document.main.setAttribute('f', await window.electronAPI.getFlip());
    };

    webview.addEventListener('did-fail-load', e => {
        if (e.errorCode === -102 /*ERR_CONNECTION_REFUSED*/){
            setTimeout(webview.reload(), 1000);
        }
    })

    function show(src, container, fit, bg_color){
        if (!container){
            const xhttp = new XMLHttpRequest();
            xhttp.open('HEAD', src, false);
            try {
                xhttp.send();
                const mime = xhttp.getResponseHeader('Content-Type') ?? '';
                if (mime.startsWith('audio')){
                    container = 'audio';
                } else if (mime.startsWith('video')){
                    container = 'video';
                } else if (mime.startsWith('image')){
                    container = 'image';
                } else {
                    container = 'web';
                }
            } catch (error) {
                console.log(error);
                container = 'web';
            }
        }

        if (container !== lastCont){
            containers.forEach(container => container.style.display = 'none');
            webview.src = '';
            videoview.src = '';
            imageview.src = '';
        }

        switch (container){
            case 'image':
                imageview.src = src;
                if (!bg_color){
                    imageview.onload = () => {
                        context.drawImage(imageview, 0, 0, 1, 1);
                        imageview.style.backgroundColor = `rgba(${context.getImageData(0, 0, 1, 1).data.join(',')})`;
                        imageview.onload = null;
                    };
                } else {
                    imageview.style.backgroundColor = bg_color;
                }
                imageview.style.display = 'flex';
                imageview.style.objectFit = fit ?? 'contain';
                lastCont = container;
                break;
            case 'video':
                videoview.src = src;
                videoview.style.display = 'flex';
                videoview.style.objectFit = fit ?? 'contain';
                videoview.style.backgroundColor = bg_color ?? '#000000';
                videoview.play();
                lastCont = container;
                break;
            case 'boot':
                boot_screen.style.display = 'flex';
                lastCont = container;
                break;
            case 'web':
            default:
                webview.src = src;
                webview.style.display = 'flex';
                lastCont = 'web';
                break;
        }
    }

    function setOrientation(orientation){
        document.body.setAttribute('r', orientation);
    }

    function getOrientation(){
        return document.body.getAttribute('r') || 0;
    }

    function setFlip(flip){
        document.main.setAttribute('f', flip);
    }

    function getFlip(){
        return document.main.getAttribute('f') || 0;
    }

</script>

</html>
