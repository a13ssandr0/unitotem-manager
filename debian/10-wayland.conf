# The local Wayland session of the kiosk (labwc, started by the image's compositor service) lives in this directory and on this
# socket - see WebviewApp.display_available(), which checks the real socket before ever using it, so this is a no-op on a node
# with no display at all.
[Service]
Environment=XDG_RUNTIME_DIR=/run/unitotem/xdg
Environment=WAYLAND_DISPLAY=wayland-0
