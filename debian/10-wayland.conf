# The local Wayland session of the kiosk (labwc, started by the image's compositor service) listens on this socket - see
# WebviewApp.display_available(), which checks the real socket before ever using it, so this is a no-op on a node with no display at
# all. The compositor keeps its own private runtime directory (/run/unitotem/xdg), so a Wayland client gets the socket by its absolute
# path.
# XDG_RUNTIME_DIR is root's (where the sound server's pulse socket and root's session bus are): without it the browser and the
# audio controls cannot find PipeWire (measured on a Pi 4: the page played, no stream ever appeared, no sound).
[Service]
Environment=XDG_RUNTIME_DIR=/run/user/0
Environment=WAYLAND_DISPLAY=/run/unitotem/xdg/wayland-0
