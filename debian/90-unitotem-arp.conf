# Several interfaces on one subnet (cable plus Wi-Fi, which a /23 makes easy): by default Linux answers an ARP request for
# ANY of its addresses on ANY interface, so the router can learn the cable's address at the Wi-Fi card's MAC and the cable
# "loses" the node whenever the Wi-Fi is reconfigured. Answer only for the address of the interface that was asked.
net.ipv4.conf.all.arp_ignore = 1
net.ipv4.conf.all.arp_announce = 2
net.ipv4.conf.default.arp_ignore = 1
net.ipv4.conf.default.arp_announce = 2
