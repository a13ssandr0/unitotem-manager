# The local X session of the kiosk always runs on :0 - see WebviewApp.display_available(), which checks the actual X11
# socket before ever using this, so this is a no-op on a node with no display at all.
[Service]
Environment=DISPLAY=:0
# xinitrc (unitotem-system) copies the X session's actual auth cookie here, since it is a separate systemd unit with no
# other way to learn xinit's randomly-named one. Tolerant of the file not existing yet (headless nodes, or this unit
# racing X's own startup - it'll pick it up on the next retry).
Environment=XAUTHORITY=/run/unitotem-x11.auth
