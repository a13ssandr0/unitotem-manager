<!DOCTYPE busconfig PUBLIC "-//freedesktop//DTD D-BUS Bus Configuration 1.0//EN"
 "http://www.freedesktop.org/standards/dbus/1.0/busconfig.dtd">
<!-- UniTotem collects desktop notifications (org.freedesktop.Notifications) from the services of the machine into its
     notification center. Only root (the manager) may own the name; anybody may send a notification to it. -->
<busconfig>
  <policy user="root">
    <allow own="org.freedesktop.Notifications"/>
  </policy>
  <policy context="default">
    <allow send_destination="org.freedesktop.Notifications"/>
  </policy>
</busconfig>
