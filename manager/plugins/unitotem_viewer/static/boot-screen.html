<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>UniTotem</title>
  <script>
    /* The title is the name of the window in the compositor's list: on Wayland the compositor's window rules find the
       window of an output by it ('unitotem-<window id>', see wayland.py). Harmless on X11. */
    document.title = 'unitotem-' + (new URLSearchParams(location.search).get('window') ?? '');
  </script>
  <style>
    @font-face {
      font-family: "Noto Sans";
      src: url(NotoSans.ttf);
    }

    *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }

    html {
      width: 100%; height: 100%;
      overflow: hidden;
      /* Wordmark em size, in px; kept in sync with the smallest connected
         screen's plymouth splash (unitotem.script) via updateBootScale()
         below, so the boot-screen handoff never changes the logo's size. */
      --boot-em: 240px;
    }

    /* Content orientation (screen rotation without affecting the real
       screen) is driven by document.body's [r] attribute - see
       setOrientation()/getOrientation() below. Swapping width/height and
       re-anchoring via transform-origin+top keeps the rotated box filling
       the same physical viewport instead of just spinning in place and
       clipping. */
    body {
      position: absolute;
      width: 100vw; height: 100vh;
      overflow: hidden;
      background: rgb(0, 0, 0);
    }
    body[r="1"] {
      transform: rotate(90deg);
      transform-origin: bottom left;
      width: 100vh; height: 100vw;
      top: -100vw;
    }
    body[r="2"] { transform: rotate(180deg); }
    body[r="3"] {
      transform: rotate(270deg);
      transform-origin: top left;
      width: 100vh; height: 100vw;
      top: 100vh;
    }

    /* Content flip (e.g. for backwards projection) lives on a separate
       wrapper from orientation - see setFlip()/getFlip() below - so the two
       compose independently regardless of which is applied first/last;
       combining both into a single transform on one element made flip
       mirror along the already-rotated axes instead of the true screen
       horizontal/vertical. */
    main {
      position: relative;
      width: 100%; height: 100%;
    }
    main[f="1"] { transform: scaleX(-1); }
    main[f="2"] { transform: scaleY(-1); }

    /* Wraps every container so a one-time post-handoff transform (see
       beginOrientationIntro() below) can visually cancel out body[r]'s
       rotation and main[f]'s flip and reveal them smoothly, instead of
       snapping instantly into whatever orientation/flip was configured
       before this page even loaded. */
    #orient-intro {
      position: relative;
      width: 100%; height: 100%;
      transform-origin: center center;
    }

    /* What a window is made of (docs/layout-and-ticker.md): the backdrop (body and #stage, the margin colour) behind #area, a
       rectangle of the window (percent, in the space of the content) that holds #panes, one .pane per leaf of the layout tree
       laid out side by side or stacked, and #ticker-host. A pane is a stage of its own: the containers below, its own zoom,
       audio and refresh. */
    #area { position: absolute; left: 0; top: 0; width: 100%; height: 100%; }
    #panes { position: absolute; inset: 0; }

    /* Panes are positioned in percent of #panes, all of them side by side in one flat list rather than nested: the element of
       a pane stays where it is in the document when the layout changes, which is what keeps its video playing (moving an
       element to another parent reloads it). Each is a size container, so the boot logo is sized in its own width. */
    .pane {
      position: absolute; overflow: hidden;
      container-type: size;
      background-color: rgb(0, 0, 0);
    }

    /* The ticker bar (webui/src/ticker.js) draws in #ticker-host; the placement is decided here from the attributes of #area:
       data-ticker "off" | "overlay" (over the panes) | "reserve" (the panes make room), data-ticker-pos "top" | "bottom";
       the script sets --ticker-h (px) on #area. See setTickerPlacement() below. */
    #ticker-host { display: none; position: absolute; left: 0; right: 0; z-index: 5; overflow: hidden; }
    #area[data-ticker="overlay"] #ticker-host, #area[data-ticker="reserve"] #ticker-host {
      display: block; height: var(--ticker-h, 0px);
    }
    #area[data-ticker-pos="top"] #ticker-host { top: 0; }
    #area[data-ticker-pos="bottom"] #ticker-host { bottom: 0; }
    #area[data-ticker="reserve"][data-ticker-pos="top"] #panes { top: var(--ticker-h, 0px); }
    #area[data-ticker="reserve"][data-ticker-pos="bottom"] #panes { bottom: var(--ticker-h, 0px); }

    /* Each container occupies the whole pane; only one is visible at a time */
    .container { display: none; width: 100%; height: 100%; }

    .boot {
      /* shown by the script (inline display:flex) */
      align-items: center;
      justify-content: center;
      color: #ffffff;
      user-select: none;
      /* the wordmark's em is an eighth of the pane's width, which for a pane that fills the window is what Plymouth's
         unitotem.script draws (and what updateBootScale() used to compute): container units, so a smaller pane has a smaller
         logo and the first frame is right without waiting for a script */
      --boot-em: 12.5cqw;
    }

    /* No zoom/fade-in here: Plymouth's unitotem.script already fades the
       wordmark in before handoff, at this exact on-screen size, so it must
       appear at full size and opacity from the very first frame. */

    /* The pulsing glow is a second, identical copy of the wordmark carrying the
       full-strength shadow, cross-faded in and out - not an animation of
       text-shadow itself.

       text-shadow is a paint property, so animating it makes Chromium
       re-rasterise the whole wordmark on every frame, for as long as the boot
       screen is up - and on a window with no playlist assigned that is
       forever, not just during boot. Measured in a standalone CEF host on the
       software-rendered test VM, this single animation cost 204% of a core at
       5120x2160 and was almost all of the viewer's idle load. opacity is a
       compositor property: the layer is rastered once and only re-blended.

       steps() then caps how often it has to be re-blended. Without a GPU every
       animated frame re-composites the whole window surface, so the idle cost
       scales with frame rate rather than with what is being animated; 10
       brightness steps per second are indistinguishable from a smooth ramp on
       a 1.5s pulse. Both changes together took the boot screen from 178% to
       44% of a core at 5120x2160, and from 38% to 9% at 1280x800.

       The two copies are stacked in one grid cell rather than positioned
       absolutely, so they share exactly the same box and cannot drift apart. */
    .glow { display: grid; }
    .glow > * { grid-area: 1 / 1; }
    .halo {
      /* rem, not em: the shadow used to be declared on .glow, whose font-size
         is the 16px default, and was merely inherited (already resolved to px)
         by the much larger .loader inside it. Declaring it here in em instead
         would resolve against .loader's own --boot-em - a 400px blur on a
         5120px-wide screen rather than the 10px halo this has always drawn. */
      text-shadow: 0 0 0.625rem #ffffff;
      animation: glow 1.5s steps(15) infinite alternate;
    }
    /* The ring is part of the real wordmark only, never of its glow copy.
       Two class selectors deliberately: .halo::before alone has exactly the
       same specificity as the .loader::before below that generates the ring,
       and being written earlier in the sheet it lost on source order - the
       copy kept its own ring and its own rotation, a third animation nobody
       could see and everybody paid for. */
    .loader.halo::before { content: none; }
    @keyframes glow {
      from { opacity: 0; }
      to   { opacity: 1; }
    }

    /* "o" replaced by a blank gap (two nbsp) filled by the spinning ring below */
    .loader {
      display: inline-block;
      font-size: var(--boot-em);
      font-family: "Noto Sans", sans-serif;
      font-weight: bold;
      color: #fff;
      position: relative;
    }
    .loader::before {
      content: '';
      position: absolute;
      left: 2.19em;
      bottom: 0.28em;
      width: 0.600em;
      height: 0.600em;
      border-radius: 50%;
      border: 0.13em solid #fff;
      border-bottom-color: #FF3D00;
      box-sizing: border-box;
      animation: rotation 3s steps(60) infinite;
    }
    /* transform only, and stepped - see the .glow comment above for why.
       The box-shadow pulse that used to ride along in these keyframes was a
       paint property as well, and being expressed in rem rather than em it was
       a 5-10px halo around a ring hundreds of pixels across: invisible in
       practice, but enough to force a repaint of the ring on every frame.
       The three intermediate keyframes only existed to carry it - 0 to 1080deg
       across the whole 3s is the same three turns per cycle they described. */
    @keyframes rotation {
      from { transform: rotate(0deg); }
      to   { transform: rotate(1080deg); }
    }

    .web {
      border: none;
    }

    /* Interactive mode (touch panel with a screensaver): the home page is the base layer and the content of the
       playlist - everything inside #stage - is an overlay on top of it, hidden until the window has been idle.
       body[data-saver] is "on" while the home page is showing and "up" while the screensaver is. The shield above
       everything catches the first touch, which ends the screensaver and goes no further; it stays for a moment after
       it so the mouse events a touch is followed by do not reach the page either. The on-screen keyboard layer
       (keyboard.js, z-index at the maximum) stays above the home page but is hidden under the screensaver.
       Without the attribute none of this applies and #stage is a plain wrapper. #stage covers the WHOLE window, the margin
       colour included: the screensaver hides everything behind it, not only the area. */
    #stage { position: relative; width: 100%; height: 100%; }
    /* The on-screen keyboard slides the content up (like iOS) when a text field is too low for it: keyboard.js sets
       --ut-kbd-shift and the attribute on #orient-intro, the transform is only there while it is needed. */
    #stage, #home-frame { transition: transform .35s ease-in-out; }
    #orient-intro[data-kbd-shift] > #stage, #orient-intro[data-kbd-shift] > #home-frame { transform: translateY(var(--ut-kbd-shift, 0px)); }
    #home-frame { display: none; border: none; position: absolute; inset: 0; width: 100%; height: 100%; z-index: 1; }
    #shield { display: none; position: absolute; inset: 0; z-index: 20; touch-action: none; background: transparent; }
    body[data-saver] #home-frame { display: block; }
    body[data-saver] #stage {
      position: absolute; inset: 0; z-index: 10;
      background-color: rgb(0, 0, 0);
      visibility: hidden; pointer-events: none;
    }
    body[data-saver="up"] #stage { visibility: visible; pointer-events: auto; }
    body[data-saver="up"] #shield, body[data-shield] #shield { display: block; }
    body[data-saver="up"] #ut-kbd-layer { visibility: hidden; }

    .image { object-position: center; }
    .video { object-position: center; }

    /* the audio container is invisible; only its <audio> element matters */
    .audio { background: transparent; }
  </style>
</head>
<body>
  <main id="content-root">
    <div id="orient-intro">
      <!-- the home page of an interactive window; the sandbox keeps it from navigating this page away -->
      <iframe  id="home-frame"
               sandbox="allow-scripts allow-same-origin allow-forms allow-popups allow-modals"
               allowfullscreen></iframe>

      <div id="stage">
        <div id="area">
          <!-- One .pane per leaf of the layout (setWindowLayout() below). The one of an undivided window is here from the
               start, showing the boot logo, so the first painted frame does not wait for a script. -->
          <div id="panes">
            <div class="pane" data-pane="1" style="left: 0; top: 0; width: 100%; height: 100%">
              <div class="boot container" style="display: flex">
                <div class="glow">
                  <span class="loader">UniT&nbsp;&nbsp;tem</span>
                  <span class="loader halo" aria-hidden="true">UniT&nbsp;&nbsp;tem</span>
                </div>
              </div>

              <iframe  class="web container"
                       sandbox="allow-scripts allow-same-origin allow-forms allow-popups"
                       allowfullscreen></iframe>

              <img     class="image container" alt="">

              <video   class="video container"
                       autoplay loop playsinline></video>

              <div     class="audio container">
                <audio autoplay loop></audio>
              </div>
            </div>
          </div>
          <div id="ticker-host" data-ticker-host></div>
        </div>
      </div>

      <div id="shield"></div>
    </div>
  </main>

  <script>
    "use strict";

    // ── the panes ────────────────────────────────────────────────────────────────────────────────────────────────────
    //
    // A window is a tree of panes (utils/models/layout.py); each leaf is a Stage: the containers of one playlist, with its own
    // zoom, volume and refresh. setWindowLayout() builds/updates them; show() and setAssetAudio() take the pane they talk
    // about (none: the main pane, the first one - which is also all an older manager knows of).
    const panesEl = document.getElementById('panes');
    const areaEl = document.getElementById('area');
    const stageEl = document.getElementById('stage');

    // The sound output of this window, for every pane; survives the next show()
    let audioOutput = null;
    let touchSet = false;        // a pane has been shown at least once: the page's touch-action follows the panes from then on

    /**
     * Work out which container an asset belongs in when nobody told us.
     *
     * The manager leaves an asset's media type unknown whenever it cannot know
     * it - a plain URL, which may just as well point straight at a JPEG or an
     * MP4 as at a page. Asking the server for the Content-Type is the only way
     * to tell, and it is what this viewer did before the Qt/CEF migration.
     * Anything that is not recognisable media is shown as a web page, which is
     * both the sane default and what the previous implementation did on error.
     */
    async function detectContainer(src) {
      try {
        const resp = await fetch(src, { method: 'HEAD' });
        const mime = resp.headers.get('Content-Type') || '';
        if (mime.startsWith('audio')) return 'audio';
        if (mime.startsWith('video')) return 'video';
        if (mime.startsWith('image')) return 'image';
      } catch (err) {
        console.log('HEAD probe failed for', src, err);
      }
      return 'web';
    }

    async function routeToOutput(el) {
      if (typeof el.setSinkId !== 'function') return;
      try {
        let sink = '';  // '' is the system default
        if (audioOutput) {
          const devices = await navigator.mediaDevices.enumerateDevices();
          // On Linux the browser labels an output with the sink description PulseAudio gives it
          sink = (devices.find(d => d.kind === 'audiooutput' && d.label === audioOutput) || {}).deviceId || '';
        }
        await el.setSinkId(sink);
      } catch (err) {
        console.log('Cannot select the audio output', err);
      }
    }

    function applyAudio(el, volume, muted) {
      el.volume = Math.min(1, Math.max(0, volume ?? 1));
      el.muted = !!muted;
      routeToOutput(el);
    }

    class Stage {
      constructor(id, el) {
        this.id = id;
        this.el = el;
        this.containers = {
          boot : el.querySelector('.boot'),
          web  : el.querySelector('.web'),
          image: el.querySelector('.image'),
          video: el.querySelector('.video'),
          audio: el.querySelector('.audio'),
        };
        this.video = this.containers.video;
        this.audio = this.containers.audio.querySelector('audio');
        // What the pane shows, for the screensaver (nothing to play: boot logo, or the "no assets" page of an idle window)
        this.current = null;
        this.allowPinch = false;
        this.seq = 0;
      }

      // What is behind the content of this pane
      setBackdrop(colour) {
        this.el.style.backgroundColor = colour;
      }

      hideAll() {
        for (const el of Object.values(this.containers)) {
          el.style.display = 'none';
        }
      }

      /**
       * Zoom of a web page, like the browser's own: the iframe is made 1/zoom times as large as the pane and scaled up
       * by zoom from its top-left corner, so the page's layout viewport shrinks (a 2x zoom lays a 960px-wide page out in
       * 960 CSS px on a 1920px pane) exactly as it does with Ctrl-+. Done on the frame, not with CEF's zoom level, so it
       * works for cross-origin content and leaves the viewer's own overlays (the keyboard) alone. It is clamped here too:
       * the factor ends up in a division.
       *
       * Pinch zoom of the visitor: touch-action on the frame is intersected with the one of the content inside it, so
       * 'pan-x pan-y' (no 'pinch-zoom') forbids it whatever the page says; 'auto' leaves it to the page. It is set on the
       * pane (a touch never gets to another pane's frame without crossing its own) and the page as a whole allows it as soon
       * as one pane does.
       */
      applyWebView(zoom, allowPinch) {
        const el = this.containers.web;
        const z = Number.isFinite(+zoom) ? Math.min(5, Math.max(0.25, +zoom)) : 1;
        const style = el.style;
        if (z === 1) {
          style.width = style.height = style.transform = style.transformOrigin = '';
        } else {
          style.width = style.height = (100 / z) + '%';
          style.transform = `scale(${z})`;
          style.transformOrigin = '0 0';
        }
        this.allowPinch = !!allowPinch;
        const touch = allowPinch ? 'auto' : 'pan-x pan-y';
        style.touchAction = touch;
        this.el.style.touchAction = touch;
        touchSet = true;
        updateTouchAction();
      }

      // Volume or mute of the asset on screen edited while it plays: no new show(), the media keeps playing
      setAssetAudio(volume, muted) {
        for (const el of [this.video, this.audio]) applyAudio(el, volume, muted);
      }

      routeAudio() {
        routeToOutput(this.video);
        routeToOutput(this.audio);
      }

      /**
       * @param {string} src       - URL or data URI of the asset
       * @param {string} container - 'boot' | 'web' | 'image' | 'video' | 'audio'
       * @param {string} fit       - 'contain' | 'cover' | 'fill'
       * @param {string} bg_color  - CSS colour, e.g. 'rgb(0,0,0)'
       */
      async show(src, container, fit, bg_color, volume, muted, zoom, allowPinch, idle) {
        const seq = ++this.seq;
        if (!container) container = await detectContainer(src);
        if (seq !== this.seq) return;        // a newer asset arrived while the type was being probed

        this.current = {src, container, idle: !!idle};
        this.setBackdrop(bg_color || 'rgb(0,0,0)');
        this.hideAll();

        const el = this.containers[container];
        if (!el) return;
        // Zoom and pinch are properties of a web page; never leave them behind on the frame for the next asset
        if (container !== 'web') this.applyWebView(1, false);

        switch (container) {
          case 'boot':
            el.style.display = 'flex';
            break;

          case 'web':
            el.style.display = 'block';
            this.applyWebView(zoom, allowPinch);
            el.src = src;
            break;

          case 'image':
            el.style.display    = 'block';
            el.style.objectFit  = fit;
            el.style.backgroundColor = bg_color || '';
            // Sample the picture only when no colour was chosen for it.
            el.onload = bg_color ? null : () => { this.applyDominantColour(el); el.onload = null; };
            el.src = src;
            break;

          case 'video': {
            el.style.display   = 'block';
            el.style.objectFit = fit;
            el.src = src;
            applyAudio(el, volume, muted);
            el.load();
            if (stageVisible()) el.play().catch(() => {}); else el.pause();    // pause() cancels the autoplay
            break;
          }

          case 'audio': {
            el.style.display = 'block';  // show the wrapper (invisible)
            this.audio.src = src;
            applyAudio(this.audio, volume, muted);
            this.audio.load();
            if (stageVisible()) this.audio.play().catch(() => {}); else this.audio.pause();
            break;
          }
        }
      }

      /**
       * Average colour of an image, used as its backdrop when no explicit
       * bg_color was set, so a picture that does not match the aspect
       * ratio of the pane is letterboxed with something close to its own colour instead of
       * hard black bars. The picture is scaled down to a small canvas and the pixels are averaged here: scaling to
       * ONE pixel and letting the browser do the averaging, as this used to, gave white on the Pi 4 once its canvas was
       * in some states (a 64x36 canvas of the same picture was right), so the bars came out white.
       */
      applyDominantColour(img) {
        try {
          const canvas = document.createElement('canvas');
          canvas.width = 16;
          canvas.height = 9;
          const context = canvas.getContext('2d', {willReadFrequently: true});
          context.drawImage(img, 0, 0, 16, 9);
          const data = context.getImageData(0, 0, 16, 9).data;
          let r = 0, g = 0, b = 0, n = 0;
          for (let i = 0; i < data.length; i += 4) {
            if (!data[i + 3]) continue;        // fully transparent: not part of the picture
            r += data[i]; g += data[i + 1]; b += data[i + 2]; n++;
          }
          if (!n) return;                      // nothing to average (an empty picture): the backdrop stays as it is
          const colour = `rgb(${Math.round(r / n)},${Math.round(g / n)},${Math.round(b / n)})`;
          img.style.backgroundColor = colour;
          this.setBackdrop(colour);
        } catch (err) {
          // A cross-origin image taints the canvas and getImageData throws;
          // black is the documented default, so just keep it.
          console.log('Cannot sample image colour', err);
        }
      }

      // The sound of the playlist must not play under the home page
      syncMedia() {
        for (const [key, el] of [['video', this.video], ['audio', this.audio]]) {
          if (!el.getAttribute('src')) continue;
          if (stageVisible() && this.current && this.current.container === key) el.play().catch(() => {}); else el.pause();
        }
      }

      /** Reloads the web page of this pane (not the idle page). Returns whether it did. */
      refreshPage() {
        if (!this.current || this.current.container !== 'web' || this.current.idle) return false;
        this.containers.web.src = this.current.src;
        return true;
      }

      /** Removes the pane for good: its media stops and lets go of its decoder, its page is unloaded. */
      destroy() {
        for (const el of [this.video, this.audio]) {
          el.pause();
          el.removeAttribute('src');
          el.load();
        }
        this.el.remove();
      }
    }

    const stages = new Map();            // leaf id -> Stage
    stages.set(1, new Stage(1, panesEl.querySelector('.pane')));
    let mainId = 1;                      // the first leaf of the tree: what a command without a pane talks to
    let layoutSeen = false;              // a SetWindowLayout has arrived
    const paneTemplate = panesEl.querySelector('.pane').cloneNode(true);
    const pendingShows = new Map();      // pane -> arguments of a show() for a pane the layout has not created yet

    const mainStage = () => stages.get(mainId);
    const stageFor = pane => (pane === null || pane === undefined) ? mainStage() : stages.get(+pane);
    const allStages = () => [...stages.values()];

    // What the main pane shows; kept for whoever asks (the screensaver code used to read it, and it is handy at a console)
    Object.defineProperty(window, 'current', {get: () => mainStage()?.current ?? null, configurable: true});

    // The page as a whole allows a pinch as soon as one pane does (each pane forbids it for itself, see applyWebView)
    function updateTouchAction() {
      if (touchSet) document.documentElement.style.touchAction = allStages().some(s => s.allowPinch) ? 'auto' : 'pan-x pan-y';
    }

    /**
     * Called by the Python viewer via CEF ExecuteJavascript.
     * `pane` is the leaf id the asset is for; none means the main pane. A pane the layout has not created yet (the commands of
     * a window can overtake its layout) is waited for, only the latest asset of it is kept.
     */
    function show(src, container, fit, bg_color, volume, muted, zoom, allowPinch, idle, pane) {
      const stage = stageFor(pane);
      if (pane !== null && pane !== undefined && (!layoutSeen || !stage)) {
        pendingShows.set(+pane, [src, container, fit, bg_color, volume, muted, zoom, allowPinch, idle]);
        return;
      }
      return stage && stage.show(src, container, fit, bg_color, volume, muted, zoom, allowPinch, idle);
    }

    // Volume or mute of the asset on screen edited while it plays: no new show(), the media keeps playing
    function setAssetAudio(volume, muted, pane) {
      const stage = stageFor(pane);
      if (stage) stage.setAssetAudio(volume, muted);
    }

    /** Called by the Python viewer: the output (description) this window plays on, null for the default. */
    function setAudioOutput(device) {
      audioOutput = device;
      for (const stage of allStages()) stage.routeAudio();
    }

    // The part of the window the page has to be sure of, whatever the manager sent: nothing here may throw or leave the screen
    // unusable (a layout comes from a file, a web page and, for a remote viewer, another machine)
    const clamp = (v, lo, hi) => Math.min(hi, Math.max(lo, v));
    const num = (v, d) => Number.isFinite(+v) && v !== null && v !== '' ? +v : d;
    const MAX_LEAVES = 8, MAX_DEPTH = 4;

    function sanitizeArea(a) {
      a = a || {};
      const width = clamp(num(a.width, 100), 5, 100), height = clamp(num(a.height, 100), 5, 100);
      const colour = typeof a.margin_color === 'string' && /^(#[0-9a-fA-F]{3,8}|rgba?\([0-9 ,.%]{5,40}\))$/.test(a.margin_color.trim())
        ? a.margin_color.trim() : 'rgb(0,0,0)';
      return {width, height, left: clamp(num(a.left, 0), 0, 100 - width), top: clamp(num(a.top, 0), 0, 100 - height),
              margin_color: colour};
    }

    /** The tree as it should be, or null if it is not one (duplicate ids, too many panes, too deep): the old one stays. */
    function sanitizeTree(tree) {
      const seen = new Set();
      const walk = (node, depth) => {
        if (!node || typeof node !== 'object' || depth > MAX_DEPTH || seen.size > MAX_LEAVES) return null;
        if (node.kind === 'leaf') {
          const id = Number.isInteger(node.id) ? node.id : NaN;
          if (!(id >= 1) || seen.has(id)) return null;
          seen.add(id);
          return {kind: 'leaf', id};
        }
        if (node.kind !== 'split' || (node.dir !== 'h' && node.dir !== 'v')) return null;
        const a = walk(node.a, depth + 1), b = walk(node.b, depth + 1);
        return a && b ? {kind: 'split', dir: node.dir, ratio: clamp(num(node.ratio, 0.5), 0.1, 0.9), a, b} : null;
      };
      const clean = walk(tree, 0);
      return clean && seen.size <= MAX_LEAVES ? clean : null;
    }

    /** leaf id -> [left, top, width, height] in percent of the panes' box, and the ids in tree order */
    function layoutRects(node, x = 0, y = 0, w = 100, h = 100, out = new Map()) {
      if (node.kind === 'leaf') { out.set(node.id, [x, y, w, h]); return out; }
      if (node.dir === 'h') {
        const wa = w * node.ratio;
        layoutRects(node.a, x, y, wa, h, out); layoutRects(node.b, x + wa, y, w - wa, h, out);
      } else {
        const ha = h * node.ratio;
        layoutRects(node.a, x, y, w, ha, out); layoutRects(node.b, x, y + ha, w, h - ha, out);
      }
      return out;
    }

    function placeStage(stage, [x, y, w, h]) {
      const style = stage.el.style;
      style.left = x + '%'; style.top = y + '%'; style.width = w + '%'; style.height = h + '%';
    }

    function newStage(id) {
      const el = paneTemplate.cloneNode(true);
      el.dataset.pane = id;
      for (const c of el.querySelectorAll('.container')) c.style.display = 'none';   // blank until something is shown
      el.style.touchAction = '';
      panesEl.appendChild(el);
      const stage = new Stage(id, el);
      // an asset the manager already sent for this pane
      stages.set(id, stage);
      return stage;
    }

    /**
     * Called by the Python viewer (SetWindowLayout), at window creation and at every change: the rectangle the content is drawn
     * in (percent of the window, in the space of the content) and the tree of panes. One stage per leaf; the stage of a pane
     * that is still there is left alone, so its media keeps playing whatever happens around it (a split, a closed neighbour,
     * a moved splitter); the stages of closed panes are destroyed. Nothing about playlists is here: the manager sends each
     * pane its own show().
     */
    function setWindowLayout(area, tree) {
      const a = sanitizeArea(area);
      const style = areaEl.style;
      style.left = a.left + '%'; style.top = a.top + '%'; style.width = a.width + '%'; style.height = a.height + '%';
      // the blank space around the area (and behind the screensaver, which covers the whole window)
      document.body.style.backgroundColor = a.margin_color;
      stageEl.style.backgroundColor = a.margin_color;

      const clean = sanitizeTree(tree);
      if (!clean) { console.log('Ignoring a layout that is not valid', tree); return; }
      const rects = layoutRects(clean);
      const ids = [...rects.keys()];

      // The window's own first pane (shown from the start) becomes the main pane when it has not been used yet: its id
      // may be another one if the pane that used to be the first was closed on an earlier run
      const first = stages.get(1);
      if (!layoutSeen && first && !ids.includes(1) && !first.current) {
        stages.delete(1);
        first.id = ids[0];
        first.el.dataset.pane = ids[0];
        stages.set(ids[0], first);
      }
      for (const id of [...stages.keys()]) {
        if (!rects.has(id)) { stages.get(id).destroy(); stages.delete(id); }
      }
      for (const id of ids) placeStage(stages.get(id) || newStage(id), rects.get(id));
      mainId = ids[0];
      layoutSeen = true;
      updateTouchAction();

      // what the manager said about panes that had not been there
      for (const [pane, args] of [...pendingShows]) {
        if (stages.has(pane)) stages.get(pane).show(...args);
      }
      pendingShows.clear();
    }

    /**
     * Where the ticker bar sits (see the page contract in docs/layout-and-ticker.md): mode 'off' | 'overlay' | 'reserve',
     * position 'top' | 'bottom'. The CSS above does the placement from these two attributes of #area; ticker.js sets --ticker-h.
     */
    function setTickerPlacement(mode, position) {
      areaEl.dataset.ticker = mode === 'overlay' || mode === 'reserve' ? mode : 'off';
      areaEl.dataset.tickerPos = position === 'top' ? 'top' : 'bottom';
    }
    setTickerPlacement('off', 'bottom');


    /**
     * Interactive mode (a touch panel): the settings arrive in window.__utSaverConfig, put there by the viewer over the
     * DevTools connection, followed by a call to applySaver() - or they were there first and this runs when the page has
     * loaded, so the order does not matter. {enabled, home_url, idle_timeout}; the timeout is kept by the viewer, which
     * calls showSaver() when the window has been idle (activity inside the cross-origin home page can only be seen from
     * outside, see cdp.py).
     */
    const saver = {on: false, up: false};
    const homeFrame = document.getElementById('home-frame');
    const shield = document.getElementById('shield');
    let graceTimer = null, graceLimit = null;

    function stageVisible() { return !saver.on || saver.up; }

    // The sound of the playlist must not play under the home page
    function syncMedia() {
      for (const stage of allStages()) stage.syncMedia();
    }

    function applySaver() {
      const cfg = window.__utSaverConfig;
      if (!cfg) return;
      if (cfg.enabled && cfg.home_url) {
        saver.on = true;
        saver.up = false;
        document.body.dataset.saver = 'on';
        if (homeFrame.dataset.url !== cfg.home_url) {
          homeFrame.dataset.url = cfg.home_url;
          homeFrame.src = cfg.home_url;
        }
      } else {
        saver.on = saver.up = false;
        delete document.body.dataset.saver;
        delete document.body.dataset.shield;
        if (homeFrame.dataset.url) {
          delete homeFrame.dataset.url;
          homeFrame.src = 'about:blank';
        }
      }
      syncMedia();
    }

    /** Called by the viewer when the window has been idle. Returns whether the screensaver is now up. */
    function showSaver() {
      // the screensaver is the playlist(s) over the home page: there must be something to play in at least one pane
      const something = allStages().some(s => s.current && s.current.container !== 'boot' && !s.current.idle);
      if (!saver.on || saver.up || !something) return false;
      saver.up = true;
      document.body.dataset.saver = 'up';
      syncMedia();
      // the focus may be in the home page, where keys would go on arriving: take it
      try { if (document.activeElement) document.activeElement.blur(); window.focus(); } catch (e) {}
      return true;
    }

    function endGrace() {
      clearTimeout(graceTimer);
      clearTimeout(graceLimit);
      graceTimer = graceLimit = null;
      delete document.body.dataset.shield;
    }

    /** Whatever touches the shield or the keyboard while the screensaver is up ends it and goes no further. */
    function onShield(ev, ends) {
      ev.preventDefault();
      ev.stopPropagation();
      if (saver.up && ends) {
        saver.up = false;
        document.body.dataset.saver = 'on';
        document.body.dataset.shield = '1';
        syncMedia();
        graceLimit = setTimeout(endGrace, 1500);     // however long a finger stays down
        try { utSaver(JSON.stringify({event: 'dismissed'})); } catch (e) {}
      }
      if (document.body.dataset.shield) {
        // the shield outlives the touch by a moment: the mouse events that follow it must not reach the page
        clearTimeout(graceTimer);
        graceTimer = setTimeout(endGrace, 400);
      }
    }
    for (const type of ['pointerdown', 'touchstart', 'mousedown', 'wheel'])
      shield.addEventListener(type, ev => onShield(ev, true), {passive: false});
    for (const type of ['pointermove', 'pointerup', 'pointercancel', 'touchmove', 'touchend', 'touchcancel',
                        'mousemove', 'mouseup', 'click', 'dblclick', 'contextmenu'])
      shield.addEventListener(type, ev => onShield(ev, false), {passive: false});
    document.addEventListener('keydown', ev => { if (saver.up) onShield(ev, true); }, true);

    /**
     * Called by the viewer on a schedule, or when the window has been idle: reloads the web pages of the panes.
     * Interactive windows are left alone and so is anything that is not a page. Returns whether it did.
     */
    function refreshPage() {
      if (saver.on) return false;
      let did = false;
      for (const stage of allStages()) did = stage.refreshPage() || did;
      return did;
    }

    /**
     * The on-screen keyboard of a touch panel (webui/src/keyboard.js, served by the manager). Its settings are put in
     * window.__utKeyboardConfig by the viewer, over the DevTools connection, and this is called afterwards - or the
     * settings were there first and this runs when the page has loaded. It is loaded only once it is enabled.
     */
    let keyboardLoad = null;
    function applyKeyboard() {
      const cfg = window.__utKeyboardConfig;
      if (!cfg) return;
      if (!keyboardLoad) {
        if (!cfg.enabled) return;
        keyboardLoad = import(cfg.module);
      }
      keyboardLoad.then(() => window.utKeyboard.configure(cfg)).catch(e => { keyboardLoad = null; console.error('keyboard', e); });
    }

    /**
     * The RSS ticker (webui/src/ticker.js, served by the manager; package B of docs/layout-and-ticker.md). The viewer puts the
     * settings of the window in window.__utTickerConfig and the merged list in window.__utTickerItems over the DevTools
     * connection and calls this, or they were there first and this runs when the page has loaded. The module is loaded only
     * once the bar is enabled; it draws in #ticker-host inside #area and sets --ticker-h on #area.
     */
    let tickerLoad = null;
    function applyTicker() {
      const cfg = window.__utTickerConfig;
      if (!cfg) return;
      setTickerPlacement(cfg.enabled ? cfg.mode : 'off', cfg.position);   // the CSS of #area places the host; ticker.js sizes it
      if (!tickerLoad) {
        if (!cfg.enabled) return;
        tickerLoad = import(cfg.module);
      }
      tickerLoad.then(() => {
        window.utTicker.update(cfg, window.__utTickerItems || []);
      }).catch(e => { tickerLoad = null; console.error('ticker', e); });
    }

    /**
     * Called by the Python viewer via CEF ExecuteJavascript.
     * orientation: 0=0deg, 1=90deg, 2=180deg, 3=270deg (clockwise)
     */
    function setOrientation(orientation) {
      document.body.setAttribute('r', orientation);
      updateBootScale();
      scheduleOrientationIntro();
    }

    function getOrientation() {
      return +(document.body.getAttribute('r') || 0);
    }

    /**
     * Called by the Python viewer via CEF ExecuteJavascript.
     * flip: 0=none, 1=horizontal, 2=vertical
     */
    function setFlip(flip) {
      document.getElementById('content-root').setAttribute('f', flip);
      scheduleOrientationIntro();
    }

    function getFlip() {
      return +(document.getElementById('content-root').getAttribute('f') || 0);
    }

    /**
     * The wordmark's em size is a CSS container unit now (`.boot { --boot-em: 12.5cqw }`): an eighth of the width of the pane
     * it is in, which for a pane that fills the window is content_width/8 - the logo ~60% of the (post-rotation) content width,
     * matching unitotem.script's own sizing rule on the Plymouth side - and follows a rotation, a resize or a split by itself.
     */
    function updateBootScale() {}

    /**
     * Plymouth always renders the splash in the screen's native orientation
     * (it has no way to know a per-window rotation/flip setting - see the
     * design notes for why). If this page loads with a rotation or flip
     * already configured, body[r]/main[f] would otherwise snap the content
     * into that orientation on the very first frame, an abrupt jump right
     * after Plymouth's upright handoff. Instead, #orient-intro starts with
     * an inline transform that exactly cancels body's rotation and main's
     * flip (plus the size difference between the native and the post-
     * rotation content width - see the "k" factor below) so the first
     * painted frame still matches Plymouth exactly, then animates that
     * transform away to reveal the real configured orientation/flip.
     *
     * setOrientation()/setFlip() are two independent calls that may arrive
     * back-to-back; the short delay lets both land before we read their
     * combined final state.
     */
    let introScheduled = false;
    // What the content looked like when the last animation ended (the first one starts from Plymouth's native look):
    // every later change animates from there, not from the native orientation.
    let shownR = 0, shownF = 0;
    function scheduleOrientationIntro() {
      if (introScheduled) return;
      introScheduled = true;
      setTimeout(beginOrientationIntro, 50);
    }

    function beginOrientationIntro() {
      introScheduled = false;   // without this only the first change ever animated
      const wrap = document.getElementById('orient-intro');
      const r = getOrientation();
      const f = getFlip();
      if (r === shownR && f === shownF && wrap.dataset.done) return;
      wrap.dataset.done = '1';
      // width of the content the animation starts from, against the one it ends at (a quarter turn swaps the sides)
      const fromWidth = shownR % 2 ? window.innerHeight : window.innerWidth;
      const contentWidth = document.getElementById('content-root').clientWidth;
      const k = contentWidth ? fromWidth / contentWidth : 1;
      // a flip is its own inverse: the start is the previous flip undone by the current one
      const sign = x => (x === 1 ? [-1, 1] : x === 2 ? [1, -1] : [1, 1]);
      const [px, py] = sign(shownF), [cx, cy] = sign(f);
      // body[r] rotates by r quarter turns: start with the previous angle (shortest way round is not needed, a
      // turn of 90/180/270 either way is what the person asked for)
      let delta = (shownR - r) * 90;
      if (delta > 180) delta -= 360;
      if (delta < -180) delta += 360;
      shownR = r; shownF = f;

      wrap.style.transition = 'none';
      wrap.style.transform = `scale(${k * px * cx}, ${k * py * cy}) rotate(${delta}deg)`;
      void wrap.offsetWidth; // force layout so the start transform is painted before animating
      wrap.style.transition = 'transform 0.6s ease-out';
      wrap.style.transform = 'none';
      wrap.addEventListener('transitionend', () => {
        wrap.style.transition = '';
        wrap.style.transform = '';
      }, { once: true });
    }
    applyKeyboard();
    applySaver();
    applyTicker();

    // The viewer keeps its own splash over this window until this page has really drawn a frame: the browser's first paint
    // is not ours (it can be white), so a fixed delay would show it. Two animation frames are the first one that is on
    // screen. Told through the DevTools binding utFrame, or when the viewer attaches after the fact (it asks for the flag).
    window.__utFramed = false;
    requestAnimationFrame(() => requestAnimationFrame(() => {
      window.__utFramed = true;
      if (typeof utFrame === 'function') utFrame('{}');
    }));
  </script>
</body>
</html>
