<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>UniTotem</title>
  <script>
    /* The title is the name of the window in the compositor's list: on Wayland the compositor's window rules find the
       window of an output by it ('unitotem-<window id>', see wayland.py). Harmless on X11. */
    document.title = 'unitotem-' + (new URLSearchParams(location.search).get('window') ?? '');
  </script>
  <style>
    @font-face {
      font-family: "Noto Sans";
      src: url(NotoSans.ttf);
    }

    *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }

    html {
      width: 100%; height: 100%;
      overflow: hidden;
      /* Wordmark em size, in px; kept in sync with the smallest connected
         screen's plymouth splash (unitotem.script) via updateBootScale()
         below, so the boot-screen handoff never changes the logo's size. */
      --boot-em: 240px;
    }

    /* Content orientation (screen rotation without affecting the real
       screen) is driven by document.body's [r] attribute - see
       setOrientation()/getOrientation() below. Swapping width/height and
       re-anchoring via transform-origin+top keeps the rotated box filling
       the same physical viewport instead of just spinning in place and
       clipping. */
    body {
      position: absolute;
      width: 100vw; height: 100vh;
      overflow: hidden;
      background: rgb(0, 0, 0);
    }
    body[r="1"] {
      transform: rotate(90deg);
      transform-origin: bottom left;
      width: 100vh; height: 100vw;
      top: -100vw;
    }
    body[r="2"] { transform: rotate(180deg); }
    body[r="3"] {
      transform: rotate(270deg);
      transform-origin: top left;
      width: 100vh; height: 100vw;
      top: 100vh;
    }

    /* Content flip (e.g. for backwards projection) lives on a separate
       wrapper from orientation - see setFlip()/getFlip() below - so the two
       compose independently regardless of which is applied first/last;
       combining both into a single transform on one element made flip
       mirror along the already-rotated axes instead of the true screen
       horizontal/vertical. */
    main {
      position: relative;
      width: 100%; height: 100%;
    }
    main[f="1"] { transform: scaleX(-1); }
    main[f="2"] { transform: scaleY(-1); }

    /* Wraps every container so a one-time post-handoff transform (see
       beginOrientationIntro() below) can visually cancel out body[r]'s
       rotation and main[f]'s flip and reveal them smoothly, instead of
       snapping instantly into whatever orientation/flip was configured
       before this page even loaded. */
    #orient-intro {
      position: relative;
      width: 100%; height: 100%;
      transform-origin: center center;
    }

    /* Each container occupies the full viewport; only one is visible at a time */
    .container { display: none; width: 100%; height: 100%; }

    #boot-screen {
      display: flex;           /* shown by default */
      align-items: center;
      justify-content: center;
      color: #ffffff;
      user-select: none;
    }

    /* No zoom/fade-in here: Plymouth's unitotem.script already fades the
       wordmark in before handoff, at this exact on-screen size, so it must
       appear at full size and opacity from the very first frame. */

    /* The pulsing glow is a second, identical copy of the wordmark carrying the
       full-strength shadow, cross-faded in and out - not an animation of
       text-shadow itself.

       text-shadow is a paint property, so animating it makes Chromium
       re-rasterise the whole wordmark on every frame, for as long as the boot
       screen is up - and on a window with no playlist assigned that is
       forever, not just during boot. Measured in a standalone CEF host on the
       software-rendered test VM, this single animation cost 204% of a core at
       5120x2160 and was almost all of the viewer's idle load. opacity is a
       compositor property: the layer is rastered once and only re-blended.

       steps() then caps how often it has to be re-blended. Without a GPU every
       animated frame re-composites the whole window surface, so the idle cost
       scales with frame rate rather than with what is being animated; 10
       brightness steps per second are indistinguishable from a smooth ramp on
       a 1.5s pulse. Both changes together took the boot screen from 178% to
       44% of a core at 5120x2160, and from 38% to 9% at 1280x800.

       The two copies are stacked in one grid cell rather than positioned
       absolutely, so they share exactly the same box and cannot drift apart. */
    .glow { display: grid; }
    .glow > * { grid-area: 1 / 1; }
    .halo {
      /* rem, not em: the shadow used to be declared on .glow, whose font-size
         is the 16px default, and was merely inherited (already resolved to px)
         by the much larger .loader inside it. Declaring it here in em instead
         would resolve against .loader's own --boot-em - a 400px blur on a
         5120px-wide screen rather than the 10px halo this has always drawn. */
      text-shadow: 0 0 0.625rem #ffffff;
      animation: glow 1.5s steps(15) infinite alternate;
    }
    /* The ring is part of the real wordmark only, never of its glow copy.
       Two class selectors deliberately: .halo::before alone has exactly the
       same specificity as the .loader::before below that generates the ring,
       and being written earlier in the sheet it lost on source order - the
       copy kept its own ring and its own rotation, a third animation nobody
       could see and everybody paid for. */
    .loader.halo::before { content: none; }
    @keyframes glow {
      from { opacity: 0; }
      to   { opacity: 1; }
    }

    /* "o" replaced by a blank gap (two nbsp) filled by the spinning ring below */
    .loader {
      display: inline-block;
      font-size: var(--boot-em);
      font-family: "Noto Sans", sans-serif;
      font-weight: bold;
      color: #fff;
      position: relative;
    }
    .loader::before {
      content: '';
      position: absolute;
      left: 2.19em;
      bottom: 0.28em;
      width: 0.600em;
      height: 0.600em;
      border-radius: 50%;
      border: 0.13em solid #fff;
      border-bottom-color: #FF3D00;
      box-sizing: border-box;
      animation: rotation 3s steps(60) infinite;
    }
    /* transform only, and stepped - see the .glow comment above for why.
       The box-shadow pulse that used to ride along in these keyframes was a
       paint property as well, and being expressed in rem rather than em it was
       a 5-10px halo around a ring hundreds of pixels across: invisible in
       practice, but enough to force a repaint of the ring on every frame.
       The three intermediate keyframes only existed to carry it - 0 to 1080deg
       across the whole 3s is the same three turns per cycle they described. */
    @keyframes rotation {
      from { transform: rotate(0deg); }
      to   { transform: rotate(1080deg); }
    }

    #web-frame {
      border: none;
    }

    /* Interactive mode (touch panel with a screensaver): the home page is the base layer and the content of the
       playlist - everything inside #stage - is an overlay on top of it, hidden until the window has been idle.
       body[data-saver] is "on" while the home page is showing and "up" while the screensaver is. The shield above
       everything catches the first touch, which ends the screensaver and goes no further; it stays for a moment after
       it so the mouse events a touch is followed by do not reach the page either. The on-screen keyboard layer
       (keyboard.js, z-index at the maximum) stays above the home page but is hidden under the screensaver.
       Without the attribute none of this applies and #stage is a plain wrapper. */
    #stage { position: relative; width: 100%; height: 100%; }
    #home-frame { display: none; border: none; position: absolute; inset: 0; width: 100%; height: 100%; z-index: 1; }
    #shield { display: none; position: absolute; inset: 0; z-index: 20; touch-action: none; background: transparent; }
    body[data-saver] #home-frame { display: block; }
    body[data-saver] #stage {
      position: absolute; inset: 0; z-index: 10;
      background-color: rgb(0, 0, 0);
      visibility: hidden; pointer-events: none;
    }
    body[data-saver="up"] #stage { visibility: visible; pointer-events: auto; }
    body[data-saver="up"] #shield, body[data-shield] #shield { display: block; }
    body[data-saver="up"] #ut-kbd-layer { visibility: hidden; }

    #image-display {
      object-position: center;
    }

    #video-display {
      object-position: center;
    }

    /* audio-display is invisible; only the <audio> element matters */
    #audio-display { background: transparent; }
  </style>
</head>
<body>
  <main id="content-root">
    <div id="orient-intro">
      <!-- the home page of an interactive window; the sandbox keeps it from navigating this page away -->
      <iframe  id="home-frame"
               sandbox="allow-scripts allow-same-origin allow-forms allow-popups allow-modals"
               allowfullscreen></iframe>

      <div id="stage">
        <div id="boot-screen" class="container">
          <div class="glow">
            <span class="loader">UniT&nbsp;&nbsp;tem</span>
            <span class="loader halo" aria-hidden="true">UniT&nbsp;&nbsp;tem</span>
          </div>
        </div>

        <iframe  id="web-frame"     class="container"
                 sandbox="allow-scripts allow-same-origin allow-forms allow-popups"
                 allowfullscreen></iframe>

        <img     id="image-display" class="container" alt="">

        <video   id="video-display" class="container"
                 autoplay loop playsinline></video>

        <div     id="audio-display" class="container">
          <audio id="audio-player" autoplay loop></audio>
        </div>
      </div>

      <div id="shield"></div>
    </div>
  </main>

  <script>
    "use strict";

    const containers = {
      boot : document.getElementById('boot-screen'),
      web  : document.getElementById('web-frame'),
      image: document.getElementById('image-display'),
      video: document.getElementById('video-display'),
      audio: document.getElementById('audio-display'),
    };

    // What is behind the content: the page body, and the stage that covers the home page in interactive mode
    function setBackdrop(colour) {
      document.body.style.backgroundColor = colour;
      document.getElementById('stage').style.backgroundColor = colour;
    }

    function hideAll() {
      for (const el of Object.values(containers)) {
        el.style.display = 'none';
      }
    }

    /**
     * Called by the Python viewer via CEF ExecuteJavascript.
     *
     * @param {string} src       - URL or data URI of the asset
     * @param {string} container - 'boot' | 'web' | 'image' | 'video' | 'audio'
     * @param {string} fit       - 'contain' | 'cover' | 'fill'
     * @param {string} bg_color  - CSS colour, e.g. 'rgb(0,0,0)'
     */
    /**
     * Work out which container an asset belongs in when nobody told us.
     *
     * The manager leaves an asset's media type unknown whenever it cannot know
     * it - a plain URL, which may just as well point straight at a JPEG or an
     * MP4 as at a page. Asking the server for the Content-Type is the only way
     * to tell, and it is what this viewer did before the Qt/CEF migration.
     * Anything that is not recognisable media is shown as a web page, which is
     * both the sane default and what the previous implementation did on error.
     */
    async function detectContainer(src) {
      try {
        const resp = await fetch(src, { method: 'HEAD' });
        const mime = resp.headers.get('Content-Type') || '';
        if (mime.startsWith('audio')) return 'audio';
        if (mime.startsWith('video')) return 'video';
        if (mime.startsWith('image')) return 'image';
      } catch (err) {
        console.log('HEAD probe failed for', src, err);
      }
      return 'web';
    }

    /**
     * Average colour of an image, used as its backdrop when no explicit
     * bg_color was set, so a picture that does not match the screen's aspect
     * ratio is letterboxed with something close to its own colour instead of
     * hard black bars. Scaling to a single pixel makes the browser do the
     * averaging for us.
     */
    function applyDominantColour(img) {
      try {
        const canvas = document.createElement('canvas');
        canvas.width = canvas.height = 1;
        const context = canvas.getContext('2d');
        context.drawImage(img, 0, 0, 1, 1);
        const [r, g, b] = context.getImageData(0, 0, 1, 1).data;
        const colour = `rgb(${r},${g},${b})`;
        img.style.backgroundColor = colour;
        setBackdrop(colour);
      } catch (err) {
        // A cross-origin image taints the canvas and getImageData throws;
        // black is the documented default, so just keep it.
        console.log('Cannot sample image colour', err);
      }
    }

    // Volume of the asset on screen and the output this window plays on; both survive the next show()
    let audioOutput = null;

    function applyAudio(el, volume, muted) {
      el.volume = Math.min(1, Math.max(0, volume ?? 1));
      el.muted = !!muted;
      routeToOutput(el);
    }

    // Volume or mute of the asset on screen edited while it plays: no new show(), the media keeps playing
    function setAssetAudio(volume, muted) {
      for (const id of ['video-display', 'audio-player']) {
        const el = document.getElementById(id);
        if (el) applyAudio(el, volume, muted);
      }
    }

    async function routeToOutput(el) {
      if (typeof el.setSinkId !== 'function') return;
      try {
        let sink = '';  // '' is the system default
        if (audioOutput) {
          const devices = await navigator.mediaDevices.enumerateDevices();
          // On Linux the browser labels an output with the sink description PulseAudio gives it
          sink = (devices.find(d => d.kind === 'audiooutput' && d.label === audioOutput) || {}).deviceId || '';
        }
        await el.setSinkId(sink);
      } catch (err) {
        console.log('Cannot select the audio output', err);
      }
    }

    /** Called by the Python viewer: the output (description) this window plays on, null for the default. */
    function setAudioOutput(device) {
      audioOutput = device;
      routeToOutput(document.getElementById('video-display'));
      routeToOutput(document.getElementById('audio-player'));
    }

    /**
     * Zoom of a web page, like the browser's own: the iframe is made 1/zoom times as large as the screen and scaled up
     * by zoom from its top-left corner, so the page's layout viewport shrinks (a 2x zoom lays a 960px-wide page out in
     * 960 CSS px on a 1920px screen) exactly as it does with Ctrl-+. Done on the frame, not with CEF's zoom level, so it
     * works for cross-origin content and leaves the viewer's own overlays (the keyboard) alone. It is clamped here too:
     * the factor ends up in a division.
     *
     * Pinch zoom of the visitor: touch-action on the frame is intersected with the one of the content inside it, so
     * 'pan-x pan-y' (no 'pinch-zoom') forbids it whatever the page says; 'auto' leaves it to the page.
     */
    function applyWebView(el, zoom, allowPinch) {
      const z = Number.isFinite(+zoom) ? Math.min(5, Math.max(0.25, +zoom)) : 1;
      const style = el.style;
      if (z === 1) {
        style.width = style.height = style.transform = style.transformOrigin = '';
      } else {
        style.width = style.height = (100 / z) + '%';
        style.transform = `scale(${z})`;
        style.transformOrigin = '0 0';
      }
      const touch = allowPinch ? 'auto' : 'pan-x pan-y';
      style.touchAction = touch;
      document.documentElement.style.touchAction = touch;
    }

    // What the stage shows, for the screensaver (nothing to play: boot logo, or the "no assets" page of an idle window)
    let current = null;

    async function show(src, container, fit, bg_color, volume, muted, zoom, allowPinch, idle) {
      if (!container) container = await detectContainer(src);

      current = {src, container, idle: !!idle};
      setBackdrop(bg_color || 'rgb(0,0,0)');
      hideAll();

      const el = containers[container];
      if (!el) return;
      // Zoom and pinch are properties of a web page; never leave them behind on the frame for the next asset
      if (container !== 'web') applyWebView(containers.web, 1, false);

      switch (container) {
        case 'boot':
          el.style.display = 'flex';
          break;

        case 'web':
          el.style.display = 'block';
          applyWebView(el, zoom, allowPinch);
          el.src = src;
          break;

        case 'image':
          el.style.display    = 'block';
          el.style.objectFit  = fit;
          el.style.backgroundColor = bg_color || '';
          // Sample the picture only when no colour was chosen for it.
          el.onload = bg_color ? null : () => { applyDominantColour(el); el.onload = null; };
          el.src = src;
          break;

        case 'video': {
          el.style.display   = 'block';
          el.style.objectFit = fit;
          el.src = src;
          applyAudio(el, volume, muted);
          el.load();
          if (stageVisible()) el.play().catch(() => {}); else el.pause();    // pause() cancels the autoplay
          break;
        }

        case 'audio': {
          el.style.display = 'block';  // show the wrapper (invisible)
          const audio = document.getElementById('audio-player');
          audio.src = src;
          applyAudio(audio, volume, muted);
          audio.load();
          if (stageVisible()) audio.play().catch(() => {}); else audio.pause();
          break;
        }
      }
    }


    /**
     * Interactive mode (a touch panel): the settings arrive in window.__utSaverConfig, put there by the viewer over the
     * DevTools connection, followed by a call to applySaver() - or they were there first and this runs when the page has
     * loaded, so the order does not matter. {enabled, home_url, idle_timeout}; the timeout is kept by the viewer, which
     * calls showSaver() when the window has been idle (activity inside the cross-origin home page can only be seen from
     * outside, see cdp.py).
     */
    const saver = {on: false, up: false};
    const homeFrame = document.getElementById('home-frame');
    const shield = document.getElementById('shield');
    let graceTimer = null, graceLimit = null;

    function stageVisible() { return !saver.on || saver.up; }

    // The sound of the playlist must not play under the home page
    function syncMedia() {
      for (const [key, el] of [['video', document.getElementById('video-display')],
                               ['audio', document.getElementById('audio-player')]]) {
        if (!el.getAttribute('src')) continue;
        if (stageVisible() && current && current.container === key) el.play().catch(() => {}); else el.pause();
      }
    }

    function applySaver() {
      const cfg = window.__utSaverConfig;
      if (!cfg) return;
      if (cfg.enabled && cfg.home_url) {
        saver.on = true;
        saver.up = false;
        document.body.dataset.saver = 'on';
        if (homeFrame.dataset.url !== cfg.home_url) {
          homeFrame.dataset.url = cfg.home_url;
          homeFrame.src = cfg.home_url;
        }
      } else {
        saver.on = saver.up = false;
        delete document.body.dataset.saver;
        delete document.body.dataset.shield;
        if (homeFrame.dataset.url) {
          delete homeFrame.dataset.url;
          homeFrame.src = 'about:blank';
        }
      }
      syncMedia();
    }

    /** Called by the viewer when the window has been idle. Returns whether the screensaver is now up. */
    function showSaver() {
      if (!saver.on || saver.up || !current || current.container === 'boot' || current.idle) return false;
      saver.up = true;
      document.body.dataset.saver = 'up';
      syncMedia();
      // the focus may be in the home page, where keys would go on arriving: take it
      try { if (document.activeElement) document.activeElement.blur(); window.focus(); } catch (e) {}
      return true;
    }

    function endGrace() {
      clearTimeout(graceTimer);
      clearTimeout(graceLimit);
      graceTimer = graceLimit = null;
      delete document.body.dataset.shield;
    }

    /** Whatever touches the shield or the keyboard while the screensaver is up ends it and goes no further. */
    function onShield(ev, ends) {
      ev.preventDefault();
      ev.stopPropagation();
      if (saver.up && ends) {
        saver.up = false;
        document.body.dataset.saver = 'on';
        document.body.dataset.shield = '1';
        syncMedia();
        graceLimit = setTimeout(endGrace, 1500);     // however long a finger stays down
        try { utSaver(JSON.stringify({event: 'dismissed'})); } catch (e) {}
      }
      if (document.body.dataset.shield) {
        // the shield outlives the touch by a moment: the mouse events that follow it must not reach the page
        clearTimeout(graceTimer);
        graceTimer = setTimeout(endGrace, 400);
      }
    }
    for (const type of ['pointerdown', 'touchstart', 'mousedown', 'wheel'])
      shield.addEventListener(type, ev => onShield(ev, true), {passive: false});
    for (const type of ['pointermove', 'pointerup', 'pointercancel', 'touchmove', 'touchend', 'touchcancel',
                        'mousemove', 'mouseup', 'click', 'dblclick', 'contextmenu'])
      shield.addEventListener(type, ev => onShield(ev, false), {passive: false});
    document.addEventListener('keydown', ev => { if (saver.up) onShield(ev, true); }, true);

    /**
     * Called by the viewer on a schedule, or when the window has been idle: reloads the web page on the stage.
     * Interactive windows are left alone and so is anything that is not a page. Returns whether it did.
     */
    function refreshPage() {
      if (saver.on || !current || current.container !== 'web' || current.idle) return false;
      containers.web.src = current.src;
      return true;
    }

    /**
     * The on-screen keyboard of a touch panel (webui/src/keyboard.js, served by the manager). Its settings are put in
     * window.__utKeyboardConfig by the viewer, over the DevTools connection, and this is called afterwards - or the
     * settings were there first and this runs when the page has loaded. It is loaded only once it is enabled.
     */
    let keyboardLoad = null;
    function applyKeyboard() {
      const cfg = window.__utKeyboardConfig;
      if (!cfg) return;
      if (!keyboardLoad) {
        if (!cfg.enabled) return;
        keyboardLoad = import(cfg.module);
      }
      keyboardLoad.then(() => window.utKeyboard.configure(cfg)).catch(e => { keyboardLoad = null; console.error('keyboard', e); });
    }

    /**
     * The RSS ticker (webui/src/ticker.js, served by the manager; package B of docs/layout-and-ticker.md). The viewer puts the
     * settings of the window in window.__utTickerConfig and the merged list in window.__utTickerItems over the DevTools
     * connection and calls this, or they were there first and this runs when the page has loaded. The module is loaded only
     * once the bar is enabled; it draws in #ticker-host inside #area and sets --ticker-h on #area.
     */
    let tickerLoad = null;
    function applyTicker() {
      const cfg = window.__utTickerConfig;
      if (!cfg) return;
      if (!tickerLoad) {
        if (!cfg.enabled) return;
        tickerLoad = import(cfg.module);
      }
      tickerLoad.then(() => {
        window.utTicker.update(cfg, window.__utTickerItems || []);
      }).catch(e => { tickerLoad = null; console.error('ticker', e); });
    }

    /**
     * Called by the Python viewer via CEF ExecuteJavascript.
     * orientation: 0=0deg, 1=90deg, 2=180deg, 3=270deg (clockwise)
     */
    function setOrientation(orientation) {
      document.body.setAttribute('r', orientation);
      updateBootScale();
      scheduleOrientationIntro();
    }

    function getOrientation() {
      return +(document.body.getAttribute('r') || 0);
    }

    /**
     * Called by the Python viewer via CEF ExecuteJavascript.
     * flip: 0=none, 1=horizontal, 2=vertical
     */
    function setFlip(flip) {
      document.getElementById('content-root').setAttribute('f', flip);
      scheduleOrientationIntro();
    }

    function getFlip() {
      return +(document.getElementById('content-root').getAttribute('f') || 0);
    }

    /**
     * Wordmark em size, in px: kept at content_width/8 so the boot-screen
     * logo is always ~60% of the (post-rotation) content width, matching
     * unitotem.script's own sizing rule on the Plymouth side.
     */
    function updateBootScale() {
      const width = document.getElementById('content-root').clientWidth;
      document.documentElement.style.setProperty('--boot-em', (width / 8) + 'px');
    }
    window.addEventListener('load', updateBootScale);
    window.addEventListener('resize', updateBootScale);

    /**
     * Plymouth always renders the splash in the screen's native orientation
     * (it has no way to know a per-window rotation/flip setting - see the
     * design notes for why). If this page loads with a rotation or flip
     * already configured, body[r]/main[f] would otherwise snap the content
     * into that orientation on the very first frame, an abrupt jump right
     * after Plymouth's upright handoff. Instead, #orient-intro starts with
     * an inline transform that exactly cancels body's rotation and main's
     * flip (plus the size difference between the native and the post-
     * rotation content width - see the "k" factor below) so the first
     * painted frame still matches Plymouth exactly, then animates that
     * transform away to reveal the real configured orientation/flip.
     *
     * setOrientation()/setFlip() are two independent calls that may arrive
     * back-to-back; the short delay lets both land before we read their
     * combined final state.
     */
    let introScheduled = false;
    function scheduleOrientationIntro() {
      if (introScheduled) return;
      introScheduled = true;
      setTimeout(beginOrientationIntro, 50);
    }

    function beginOrientationIntro() {
      const wrap = document.getElementById('orient-intro');
      const r = getOrientation();
      const f = getFlip();
      const contentWidth = document.getElementById('content-root').clientWidth;
      const k = contentWidth ? window.innerWidth / contentWidth : 1;
      const flipX = f === 1 ? -1 : 1;
      const flipY = f === 2 ? -1 : 1;

      wrap.style.transition = 'none';
      wrap.style.transform = `scale(${k * flipX}, ${k * flipY}) rotate(${-r * 90}deg)`;
      void wrap.offsetWidth; // force layout so the start transform is painted before animating
      wrap.style.transition = 'transform 0.6s ease-out';
      wrap.style.transform = 'none';
      wrap.addEventListener('transitionend', () => {
        wrap.style.transition = '';
        wrap.style.transform = '';
      }, { once: true });
    }
    applyKeyboard();
    applySaver();
    applyTicker();

    // The viewer keeps its own splash over this window until this page has really drawn a frame: the browser's first paint
    // is not ours (it can be white), so a fixed delay would show it. Two animation frames are the first one that is on
    // screen. Told through the DevTools binding utFrame, or when the viewer attaches after the fact (it asks for the flag).
    window.__utFramed = false;
    requestAnimationFrame(() => requestAnimationFrame(() => {
      window.__utFramed = true;
      if (typeof utFrame === 'function') utFrame('{}');
    }));
  </script>
</body>
