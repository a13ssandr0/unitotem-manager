<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>ticker test page</title>
  <link rel="stylesheet" href="/shim.css">
  <style>
    html, body { margin: 0; width: 100%; height: 100%; background: #000; overflow: hidden; }
    body { position: absolute; width: 100vw; height: 100vh; }
    /* a recognisable picture behind the bar: stripes and a label, so overlay vs reserve is visible */
    #panes { background: repeating-linear-gradient(135deg, #1b3a5c 0 40px, #14304e 40px 80px); color: #fff; font: bold 5vmin sans-serif;
      display: flex; align-items: center; justify-content: center; text-align: center; }
  </style>
</head>
<body>
  <div id="area" data-ticker="off" data-ticker-pos="bottom">
    <div id="panes"><span>PANES<br>(the playlist content)</span></div>
    <div id="ticker-host"></div>
  </div>
  <script type="module">
    // what the viewer's page does in applyTicker(): the settings and the list are put on the window, the module is imported once
    window.applyTicker = async function () {
      const cfg = window.__utTickerConfig
      if (!cfg) return
      await import(cfg.module)
      window.utTicker.update(cfg, window.__utTickerItems || [])
    }
    window.__ready = true
  </script>
</body>
</html>
